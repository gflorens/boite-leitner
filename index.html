<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte de Leitner</title>
<meta name="description" content="Révision de cartes en boîte de Leitner pour la classe.">
<meta name="theme-color" content="#1f5fa8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout : une colonne de travail (aujourd'hui → boîte → séries), la carte de révision prend tout l'écran pendant une séance. */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#1d2733; --muted:#5d6b7a; --line:#d5dce4;
  --accent:#1f5fa8; --accent-ink:#ffffff; --ok:#2e7d4f; --ko:#b8432f; --soft:#e3eaf2;
  --warn:#fff3c4; --warn-ink:#5c4300; --warn-line:#e2b93b; --b1:#d9534f; --b2:#ef9a3c; --b3:#e9c440; --b4:#7fb85a; --b5:#3fa39b; --b6:#4f86c6; --b7:#8a6cc4;
  --shadow:0 1px 2px rgba(20,35,55,.08),0 6px 18px rgba(20,35,55,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --paper:#1b222b; --ink:#e7edf3; --muted:#9aa8b6; --line:#2e3946;
  --accent:#6aa5ea; --accent-ink:#0d1620; --ok:#5cbf83; --ko:#ec7a63; --soft:#232c37; --warn:#3a3014; --warn-ink:#f3d985; --warn-line:#8a6d1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --paper:#1b222b; --ink:#e7edf3; --muted:#9aa8b6; --line:#2e3946;
  --accent:#6aa5ea; --accent-ink:#0d1620; --ok:#5cbf83; --ko:#ec7a63; --soft:#232c37; --warn:#3a3014; --warn-ink:#f3d985; --warn-line:#8a6d1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:flex;gap:3px;align-items:flex-end;height:30px}
.logo i{display:block;width:7px;border-radius:2px 2px 0 0}
.deckpick{display:flex;gap:8px;align-items:center;min-width:0}
.deckpick select{max-width:min(320px,60vw);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.sync{font-size:.8rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{padding:14px 22px;font-size:1.1rem}
.btn.danger{color:var(--ko)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:default}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.today{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.today .counts{display:flex;gap:28px;flex-wrap:wrap;margin-top:10px}
.count b{display:block;font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1}
.count span{font-size:.85rem;color:var(--muted)}
.today .actions{display:flex;flex-direction:column;gap:8px;align-items:stretch}
@media (max-width:560px){.today{grid-template-columns:1fr}}

/* La boîte : compartiments en rangée */
.box{display:grid;gap:8px;margin-top:14px}
.slot{background:var(--soft);border-radius:8px 8px 4px 4px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative;border-top:5px solid var(--c)}
.stack{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.stack i{display:block;width:62%;background:var(--c);border-radius:3px;opacity:.85;min-height:3px;transition:height .4s}
.slot b{font-family:var(--f-display);font-size:1.3rem}
.slot small{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.2}
.slot .tag{font-size:.7rem;font-weight:700;color:var(--muted)}
.boxfoot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.88rem}

.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.fday{text-align:center;font-size:.78rem;color:var(--muted)}
.fday .bar{height:44px;display:flex;align-items:flex-end;justify-content:center}
.fday .bar i{display:block;width:60%;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px}
.fday b{display:block;color:var(--ink);font-size:.9rem}

.decks{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.deckrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:10px}
.deckrow.on{border-color:var(--accent);background:var(--soft)}
.deckrow .name{flex:1;min-width:160px;font-weight:700}
.deckrow .name small{display:block;font-weight:400;color:var(--muted)}

/* Séance de révision */
.session{display:flex;flex-direction:column;gap:18px;align-items:center}
.sessbar{width:100%;display:flex;align-items:center;gap:12px}
.progress{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.scene{width:min(440px,100%);aspect-ratio:5/3.4;max-width:100%;perspective:1200px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:var(--c,var(--accent))}
.face.back{transform:rotateY(180deg)}
.face .main{font-family:var(--f-body);font-weight:700;font-size:clamp(2rem,9vw,4.4rem);line-height:1.1;white-space:pre-line;overflow-wrap:anywhere}
.face.back .main{font-size:clamp(1.6rem,7vw,3rem)}
.face .main.long{font-size:clamp(1.1rem,4.5vw,1.8rem)}
.face .hint{margin-top:10px;color:var(--muted);font-size:.95rem}
.face .meta{position:absolute;bottom:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.answer{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn.ko{background:var(--ko);border-color:var(--ko);color:var(--paper)}
.keys{font-size:.8rem;color:var(--muted);text-align:center}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .score{font-family:var(--f-display);font-size:3rem;font-weight:800}

/* Formulaires */
.form{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select,.field textarea{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:200px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.88rem;line-height:1.45;resize:vertical}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row .field{flex:1;min-width:140px}
.intervals{display:flex;gap:8px;flex-wrap:wrap}
.intervals label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted)}
.intervals input{width:64px;text-align:center;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);border-top:4px solid var(--c)}
.help{font-size:.85rem;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
details summary{cursor:pointer;font-weight:700}
/* Prénoms */
.who{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding-block:24px}
.who h2{font-size:1.6rem}
.names{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
.namebtn{font-family:var(--f-display);font-weight:700;font-size:1.25rem;padding:16px 24px;border-radius:14px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);min-width:120px}
.namebtn:hover{border-color:var(--accent)}
.addname{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.addname input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);min-width:0;width:220px;max-width:100%}
.manage{display:flex;flex-direction:column;gap:8px;width:min(520px,100%)}
.manage .mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.manage .mrow input{flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.me b{font-family:var(--f-display);font-size:1.05rem}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}

/* Sens de travail */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);margin-top:10px;max-width:100%}
.seg button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);text-align:left}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.off{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:.92rem}

/* Jours de révision */
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.days button{width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{margin:12px 0 0;font-size:1.02rem}
.status b{font-family:var(--f-display);font-size:1.15rem}
.slot.rest{opacity:.55}
.slot.due{box-shadow:inset 0 0 0 2px var(--c)}
.badge{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--c);color:var(--paper);padding:2px 6px;border-radius:999px;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.calwrap{overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch}
.cal{border-collapse:separate;border-spacing:0;font-size:.82rem;font-variant-numeric:tabular-nums;min-width:100%}
.cal th,.cal td{text-align:center;padding:5px 3px;border-bottom:1px solid var(--line);min-width:34px}
.cal thead th,.cal tr:first-child th{font-weight:700;vertical-align:bottom}
.cal th small{display:block;font-weight:400;color:var(--muted);font-size:.68rem;white-space:nowrap}
.cal .rowh{text-align:left;white-space:nowrap;padding-right:10px;position:sticky;left:0;background:var(--paper);z-index:1}
.cal .rowh .dot{width:9px;height:9px;margin-right:6px}
.cal .rowh small{display:inline;margin-left:6px}
.cal .now{background:var(--soft)}
.cal tr:first-child .now{border-radius:8px 8px 0 0;color:var(--accent)}
.chips{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--muted);background:var(--paper)}
.chip.on{border-color:var(--c,var(--accent));color:var(--ink);box-shadow:inset 0 0 0 1px var(--c,var(--accent))}
.chip.past{opacity:.5;text-decoration:line-through}
.chip .dot{width:9px;height:9px}
.arrow{color:var(--muted)}
@media (max-width:560px){.badge{font-size:0;padding:0;width:9px;height:9px}.box{gap:5px}.slot{padding:8px 3px 6px}.slot .tag{font-size:.64rem;white-space:nowrap}.slot small{font-size:.64rem}.stack{height:64px}}
.testbar{max-width:860px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 14px;border-radius:12px;background:var(--warn);color:var(--warn-ink);border:1px dashed var(--warn-line)}
.testbar .when{flex:1;min-width:200px}
.testbar .when b{font-family:var(--f-display);font-size:1.05rem}
.testbar .btn{background:var(--paper);color:var(--ink);padding:7px 12px}
.testpanel p{margin:4px 0 12px}
.libh{font-size:1rem;margin:20px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){.card,.stack i,.progress i{transition:none}}
</style>
</head>
<body>

<div id="testbar"></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const STANDALONE = true; // vrai dans la version installable
/* ---------- Dates ---------- */
const dayNum = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
let dayOffset = 0, testMode = false, realState = null;
const today = () => dayNum() + dayOffset;
const weekday = (n) => (n + 4) % 7; // 0 = dimanche (le jour 0 était un jeudi)
const DAY_SHORT = ["D", "L", "M", "Me", "J", "V", "S"];
const DAY_LONG = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const shortDate = (n) => new Date(n * 864e5).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", timeZone: "UTC" }).replace(".", "");
const workDays = () => (state.workDays && state.workDays.length ? state.workDays : [1, 2, 4, 5]);
const isWork = (n) => workDays().includes(weekday(n));
function workDaysFrom(n, k) { const out = []; for (let g = 0; out.length < k && g < 400; g++, n++) if (isWork(n)) out.push(n); return out; }

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return "c" + (h >>> 0).toString(36); };
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const plural = (n, s, p) => n + " " + (n > 1 ? (p || s + "s") : s);
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const listFr = (a) => (a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " puis " + a[a.length - 1]);
const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); };

const DEFAULT_INTERVALS = { 3: [1, 2, 4], 4: [1, 2, 4, 8], 5: [1, 2, 4, 8, 16], 6: [1, 2, 4, 8, 16, 32], 7: [1, 2, 4, 8, 16, 32, 64] };
const BOXC = (i) => `var(--b${Math.min(i, 7)})`;
const freqLabel = (v) => (v === 1 ? "à chaque séance" : `toutes les ${v} séances`);
// Cases au programme de la séance n, de la plus haute à la plus basse.
const boxesFor = (n, intervals) => intervals.map((v, i) => (n % v === 0 ? i + 1 : 0)).filter(Boolean).reverse();

/* ---------- Séries ---------- */
function multiplicationDeck() {
  const pairs = [];
  for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) pairs.push([a, b]);
  pairs.sort((x, y) => x[0] * x[1] - y[0] * y[1] || x[0] - y[0]);
  const count = {}; pairs.forEach(([a, b]) => (count[a * b] = (count[a * b] || 0) + 1));
  const cards = pairs.map(([a, b]) => {
    const front = String(a * b), back = a === b ? `${a} × ${b}` : `${a} × ${b}\n${b} × ${a}`;
    const hint = count[a * b] > 1 ? `avec le ${a}` : "";
    return { id: hash(front + "\0" + back + "\0" + hint), front, back, hint };
  });
  return newDeck("Tables de multiplication (2 à 9)", cards, { newPerDay: 5 }, { f: "le produit", b: "les facteurs" });
}
function newDeck(name, cards, s = {}, labels) {
  return { id: uid("d"), name, cards, labels: labels || { f: "le recto", b: "le verso" },
    settings: { newPerDay: s.newPerDay ?? 10, intervals: (s.intervals || DEFAULT_INTERVALS[5]).slice(), failMode: s.failMode || "reset", newOrder: s.newOrder || "random" } };
}
const noArt = (s) => s.replace(/^(les\s+|le\s+|la\s+|l['’]\s*)/i, "");
const dirLabel = (d, dir) => dir === "f" ? `Je vois ${d.labels.f}, je trouve ${d.labels.b}` : `Je vois ${d.labels.b}, je trouve ${d.labels.f}`;
const dirShort = (d, dir) => dir === "f" ? `${cap(noArt(d.labels.f))} → ${noArt(d.labels.b)}` : `${cap(noArt(d.labels.b))} → ${noArt(d.labels.f)}`;

/* ---------- État ---------- */
const LS_KEY = "leitner-state-v1";
let state = null, docRef = null, syncLabel = "Enregistré sur cet appareil";
function lsRead() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function lsWrite(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} }
function freshState() { return { v: 3, updatedAt: 0, workDays: [1, 2, 4, 5], decks: [multiplicationDeck()], profiles: [], activeProfile: null }; }
function newProfile(name, deckId) { return { id: uid("p"), name, activeDeck: deckId, dirs: {}, prog: {}, log: {} }; }
const emptyBox = () => ({ s: 0, day: 0, c: {} }); // s = séances faites, day = jour de la dernière séance, c = case de chaque carte

// Anciennes versions → version 3 (calendrier par case)
function migrate(s) {
  if (!s || !s.decks || !s.decks.length) return freshState();
  if (s.v === 3) return s;
  const mult = (d) => /^Tables de multiplication/.test(d.name);
  if (s.v !== 2) { // version 1 : pas de prénoms
    const p = newProfile("Profil 1", s.activeDeck);
    s.decks.forEach((d) => {
      const c = {}; Object.entries(d.progress || {}).forEach(([k, v]) => (c[k] = v.box));
      if (Object.keys(c).length) p.prog[d.id] = { f: { s: 0, day: 0, c }, r: emptyBox() };
    });
    return { v: 3, updatedAt: s.updatedAt || 0, workDays: [1, 2, 4, 5], activeProfile: null,
      profiles: Object.keys(p.prog).length ? [p] : [],
      decks: s.decks.map((d) => ({ id: d.id, name: d.name, cards: d.cards, settings: { ...(d.settings || {}), intervals: (DEFAULT_INTERVALS[((d.settings || {}).intervals || []).length] || DEFAULT_INTERVALS[5]).slice() },
        labels: mult(d) ? { f: "le produit", b: "les facteurs" } : { f: "le recto", b: "le verso" } })) };
  }
  // version 2 : une échéance par carte → une case par carte
  s.profiles.forEach((p) => {
    Object.keys(p.prog).forEach((did) => ["f", "r"].forEach((k) => {
      const old = p.prog[did][k] || {}, c = {};
      Object.entries(old).forEach(([id, q]) => (c[id] = q.b));
      p.prog[did][k] = { s: 0, day: 0, c };
    }));
    delete p.daily;
  });
  s.v = 3; return s;
}

let saveTimer = null;
function save() {
  if (testMode) return; // mode test : tout reste en mémoire
  state.updatedAt = Date.now();
  lsWrite(state);
  if (docRef) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { docRef.set(JSON.parse(JSON.stringify(state))).catch(() => { syncLabel = "Synchronisation impossible, gardé sur cet appareil"; renderSync(); }); }, 600);
  }
}
async function connectAccount() {
  try {
    for (let k = 0; k < 20 && !(window.claude && window.claude.use); k++) await new Promise((r) => setTimeout(r, 100));
    if (!window.claude || !window.claude.use) return;
    const [db, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !u) return;
    const id = await u.id(); if (!id) return;
    docRef = db.doc("data/users/" + id + "/leitner");
    const snap = await docRef.get();
    const remote = snap.exists ? migrate(JSON.parse(JSON.stringify(snap.data()))) : null;
    const base = testMode ? realState : state;
    if (remote && remote.decks && (remote.updatedAt || 0) > (base.updatedAt || 0)) {
      if (testMode) { realState = remote; realState.activeProfile = null; lsWrite(realState); }
      else {
        const active = state.activeProfile;
        state = remote; state.activeProfile = state.profiles.some((p) => p.id === active) ? active : null;
        lsWrite(state);
        if (view.name !== "session") render();
      }
    } else { await docRef.set(JSON.parse(JSON.stringify(base))); }
    syncLabel = "Synchronisé avec votre compte"; renderSync();
  } catch { /* on reste sur le stockage local */ }
}

/* ---------- Logique Leitner ---------- */
const prof = () => state.profiles.find((p) => p.id === state.activeProfile);
const deckOf = (p) => state.decks.find((d) => d.id === p.activeDeck) || state.decks[0];
const dirOf = (p, d) => p.dirs[d.id] || "f";
function boxOf(p, d, dir) { const x = (p.prog[d.id] ||= { f: emptyBox(), r: emptyBox() }); return (x[dir] ||= emptyBox()); }

function stats(p, d, dir) {
  const bx = boxOf(p, d, dir), ints = d.settings.intervals, n = ints.length, t = today();
  const boxes = Array(n).fill(0); let unseen = 0;
  for (const c of d.cards) { const b = bx.c[c.id]; if (b) boxes[Math.min(b, n) - 1]++; else unseen++; }
  const next = bx.s + 1;                    // numéro de la prochaine séance
  const doneToday = bx.day === t;
  const available = isWork(t) && !doneToday;
  const todayBoxes = boxesFor(next, ints);
  const newCount = Math.min(unseen, d.settings.newPerDay);
  const toReview = todayBoxes.reduce((a, k) => a + boxes[k - 1], 0);
  // Dates prévues des 16 prochaines séances (une par jour de séance)
  const startDay = available ? t : t + 1;
  const dates = workDaysFrom(startDay, 16);
  return { bx, boxes, unseen, next, doneToday, available, todayBoxes, newCount, toReview, n, dates };
}
function grade(p, d, dir, card, ok) {
  const bx = boxOf(p, d, dir), n = d.settings.intervals.length, cur = bx.c[card.id];
  let b;
  if (ok) b = cur ? Math.min(cur + 1, n) : Math.min(2, n);
  else b = d.settings.failMode === "down" && cur ? Math.max(1, cur - 1) : 1;
  bx.c[card.id] = b;
  const t = today(), L = p.log[t] || [0, 0]; L[0]++; if (ok) L[1]++; p.log[t] = L;
  Object.keys(p.log).map(Number).sort((a, z) => z - a).slice(60).forEach((k) => delete p.log[k]);
  return { from: cur || 0, to: b };
}

function calendar(d, s) {
  const ints = d.settings.intervals, cols = s.dates.length;
  const nums = Array.from({ length: cols }, (_, i) => s.next + i);
  const head = `<tr><th scope="col" class="rowh">Séance</th>${nums.map((n, i) => `<th scope="col" class="${i === 0 ? "now" : ""}">${n}<small>${s.dates[i] === today() ? "auj." : esc(shortDate(s.dates[i]))}</small></th>`).join("")}</tr>`;
  const rows = ints.map((v, k) => `<tr><th scope="row" class="rowh"><i class="dot" style="background:${BOXC(k + 1)}"></i>Case ${k + 1}<small>${s.boxes[k]} c.</small></th>${nums.map((n, i) =>
    `<td class="${i === 0 ? "now" : ""}">${n % v === 0 ? `<i class="dot" style="background:${BOXC(k + 1)}" title="Séance ${n} : case ${k + 1}"></i>` : ""}</td>`).join("")}</tr>`).join("");
  return `<div class="calwrap"><table class="cal">${head}${rows}</table></div>`;
}

/* ---------- Séance : de la case la plus haute à la case 1 ---------- */
let sess = null;
function startSession(practice) {
  const p = prof(), d = deckOf(p), dir = dirOf(p, d), s = stats(p, d, dir);
  if (practice) {
    const seen = d.cards.filter((c) => s.bx.c[c.id]);
    const pool = shuffle((seen.length ? seen : d.cards).slice()).slice(0, 20);
    sess = { practice: true, dir, stages: [0], stage: 0, q: pool.map((c) => ({ id: c.id })), i: 0 };
  } else {
    sess = { practice: false, dir, n: s.next, stages: s.todayBoxes.slice(), stage: -1, q: [], i: 0, newLeft: s.newCount };
  }
  Object.assign(sess, { flipped: false, firstTry: 0, firstOk: 0, retries: new Set(), moves: [], answered: 0 });
  if (!practice) nextStage();
  view = { name: "session" }; render();
}
// Nouvelles cartes : tirées au hasard parmi les jamais vues, ou dans l'ordre de la liste
function pickNew(d, bx, k) {
  const unseen = d.cards.filter((c) => !bx.c[c.id]);
  return (d.settings.newOrder === "list" ? unseen : shuffle(unseen.slice())).slice(0, k);
}
// Prend les cartes présentes dans la case au moment où on l'atteint :
// une carte ratée plus haut et retombée en case 1 est donc revue en fin de séance.
function nextStage() {
  const p = prof(), d = deckOf(p), bx = boxOf(p, d, sess.dir);
  while (++sess.stage < sess.stages.length) {
    const k = sess.stages[sess.stage];
    sess.q = d.cards.filter((c) => bx.c[c.id] === k).map((c) => ({ id: c.id, box: k }));
    if (k === 1 && sess.newLeft) {
      sess.q = sess.q.concat(pickNew(d, bx, sess.newLeft).map((c) => ({ id: c.id, box: 1, isNew: true })));
      sess.newLeft = 0;
    }
    shuffle(sess.q); // ordre aléatoire dans chaque case, nouvelles cartes mêlées à la case 1
    sess.i = 0;
    if (sess.q.length) return true;
  }
  if (sess.newLeft) { // case 1 pas au programme : les nouvelles cartes passent quand même
    sess.q = shuffle(pickNew(d, bx, sess.newLeft).map((c) => ({ id: c.id, box: 1, isNew: true })));
    sess.newLeft = 0; sess.i = 0; sess.stages.push(1);
    if (sess.q.length) return true;
  }
  return false;
}
function finishSession() {
  if (!sess.practice) { const p = prof(), d = deckOf(p), bx = boxOf(p, d, sess.dir); bx.s = sess.n; bx.day = today(); save(); }
  sess.done = true; renderDone();
}
function renderSession() {
  if (sess.done) return renderDone();
  const p = prof(), d = deckOf(p);
  if (sess.i >= sess.q.length) { if (sess.practice || !nextStage()) return finishSession(); }
  const item = sess.q[sess.i], card = d.cards.find((c) => c.id === item.id);
  if (!card) { sess.i++; return renderSession(); }
  const box = sess.practice ? (boxOf(p, d, sess.dir).c[card.id] || 0) : item.box;
  const tag = item.retry ? "À retenter" : item.isNew ? "Nouvelle" : box ? "Case " + box : "";
  const c = box ? BOXC(box) : "var(--accent)";
  const long = (s) => (s.length > 24 ? " long" : "");
  const fwd = sess.dir === "f";
  const qText = fwd ? card.front : card.back, aText = fwd ? card.back : card.front;
  const qHint = fwd && card.hint ? `<div class="hint">${esc(card.hint)}</div>` : "";
  const chips = sess.practice ? `<span class="chip on">Entraînement · ${sess.q.length - sess.i} restantes</span>` :
    sess.stages.map((k, i) => `<span class="chip ${i < sess.stage ? "past" : i === sess.stage ? "on" : ""}" style="--c:${BOXC(k)}"><i class="dot" style="background:${BOXC(k)}"></i>Case ${k}${i === sess.stage ? ` · ${sess.q.length - sess.i}` : ""}</span>`).join('<span class="arrow" aria-hidden="true">›</span>');
  app.innerHTML = `<div class="session">
    <div class="sessbar"><button class="btn ghost" id="quit">← Arrêter</button>
      <div class="chips" aria-label="Déroulement de la séance">${sess.practice ? "" : `<span class="label">Séance ${sess.n}</span>`}${chips}</div></div>
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Retourner la carte">
      <div class="card ${sess.flipped ? "flipped" : ""}" id="card">
        <div class="face front" style="--c:${c}"><div class="main${long(qText)}">${esc(qText)}</div>${qHint}
          <div class="meta"><span>${tag}</span><span>${esc(p.name)}${sess.practice ? " · entraînement" : ""}</span></div></div>
        <div class="face back" style="--c:${c}"><div class="main${long(aText)}">${esc(aText)}</div>
          <div class="meta"><span>${tag}</span><span>${esc(qText.split("\n")[0])}</span></div></div>
      </div></div>
    <div class="answer" id="answer">${sess.flipped
      ? `<button class="btn ko big" id="ko">Je ne savais pas</button><button class="btn ok big" id="ok">Je savais</button>`
      : `<button class="btn primary big" id="flip">Retourner la carte</button>`}</div>
    <div class="keys">${esc(dirLabel(d, sess.dir))} · Espace : retourner · ← : je ne savais pas · → : je savais</div>

function flip() {

  $("#ok").onclick = () => answer(true); $("#ko").onclick = () => answer(false); $("#ok").focus({ preventScroll: true });
}
function record(ok) {
  const p = prof(), d = deckOf(p), item = sess.q[sess.i], card = d.cards.find((c) => c.id === item.id);
  if (!item.retry) {
    sess.firstTry++; if (ok) sess.firstOk++; else sess.retries.add(item.id);
    if (!sess.practice) { const m = grade(p, d, sess.dir, card, ok); sess.moves.push(m); }
  }
  // Ratée en case 1 (ou en entraînement) : elle revient un peu plus loin, sans changer de case
  if (!ok && (sess.practice || item.box === 1)) sess.q.splice(Math.min(sess.q.length, sess.i + 4), 0, { id: item.id, box: item.box, retry: true });
  sess.i++;

}

    <p class="muted" style="margin:0">${sess.practice ? "Les cases n'ont pas bougé." : `Prochaine séance (${s.next}) ${DAY_LONG[weekday(s.dates[0])]} : ${nextBoxes}.`}</p>

function parseLines(text) {
  const out = [], bad = [];
  text.split("\n").forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const k = line.indexOf(";"); if (k < 0) { bad.push(i + 1); return; }
    let front = line.slice(0, k).trim(); const back = line.slice(k + 1).trim().split("|").map((x) => x.trim()).filter(Boolean).join("\n");
    let hint = ""; const m = front.match(/^(.*?)\s*\[(.+)\]$/); if (m) { front = m[1].trim(); hint = m[2].trim(); }
    if (!front || !back) { bad.push(i + 1); return; }
    out.push({ id: hash(front + "\0" + back + "\0" + hint), front, back, hint });
  });
  return { cards: out, bad };
}

    const seen = new Set(), uniq = cards.filter((c) => !seen.has(c.id) && seen.add(c.id));
    const intervals = [...app.querySelectorAll("#ints input")].map((x) => Math.max(1, Math.min(365, Math.round(+x.value || 1))));
    const settings = { newPerDay: Math.max(0, Math.min(200, Math.round(+$("#npd").value || 0))), intervals, failMode: $("#fail").value, newOrder: $("#nord").value };
    const lab = { f: $("#lf").value.trim() || "le recto", b: $("#lb").value.trim() || "le verso" };
    const name = $("#name").value.trim() || "Série sans nom";
    if (isNew) { const nd = newDeck(name, uniq, settings, lab); state.decks.push(nd); p.activeDeck = nd.id; toast("Série créée"); }
    else {
      d.name = name; d.cards = uniq; d.settings = settings; d.labels = lab;
      const ids = new Set(uniq.map((c) => c.id));
      state.profiles.forEach((q) => { const x = q.prog[d.id]; if (!x) return; ["f", "r"].forEach((k) => {
        const c = (x[k] || emptyBox()).c; Object.keys(c).forEach((id) => { if (!ids.has(id)) delete c[id]; else c[id] = Math.min(c[id], intervals.length); }); }); });
      toast("Série enregistrée");
    }
    save(); view = { name: "home" }; render();
  };
}

function render() {
  renderTestbar();
  if (view.name !== "who" && !prof()) view = { name: "who" };
  if (view.name === "who") renderWho();
  else if (view.name === "session") renderSession();
  else if (view.name === "edit") renderEdit();
  else if (view.name === "library") renderLibrary();
  else renderHome();
  if (view.name !== "session") window.scrollTo(0, 0);
}

/* ---------- Démarrage : toujours par le choix du prénom ---------- */
state = migrate(lsRead());
state.activeProfile = null;
render();
connectAccount();
document.addEventListener("visibilitychange", () => { if (!document.hidden && view.name === "home") render(); });
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  // Une nouvelle version vient de s'installer : on recharge une fois pour l'afficher
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !window.__reloaded) { window.__reloaded = true; location.reload(); } });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {}));
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
